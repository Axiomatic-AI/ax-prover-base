# Blueprint-driven proving mode.
#
# Usage:
#   ax-prover --config blueprint.yaml prove MyProject/Foo.lean:my_theorem --blueprint
#
# The three roles default to the same model but are configured independently, so an
# expensive architect can be paired with a cheap node prover:
#   blueprint:
#     architect:
#       llm: ${llm_configs.claude_opus_4_5}

import:
  - llms.yaml
  - tools.yaml

blueprint:
  enabled: true
  llm: ${llm_configs.deepseek_v4_flash}
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    provider_sort: "exacto"
  # Blueprint mode exposes only lean_compile and mathlib_search. No web or repo search.
  prover_tools:
    mathlib_search: ${tool_configs.search_lean_search}
  # max_total_tokens counts cumulative *billed* tokens, so a turn's re-sent transcript is
  # counted on every call. The paper's 65536 starved node provers after 1-2 of their 4
  # attempts while costing well under a cent, so these are deliberately generous.
  architect:
    max_total_tokens: 2000000
    max_attempts: 8
    max_tool_iterations: 8
  prover:
    max_total_tokens: 1000000
    max_attempts: 4
    max_tool_iterations: 8
    # Attempts per wave. Sequential attempts made a node needing 3 tries pay 3 full
    # round-trips; one measured node spent 18 minutes that way. Waves keep the feedback
    # loop across waves while parallelizing within one.
    attempt_concurrency: 2
    # Searches per attempt before mathlib_search is withdrawn, leaving only lean_compile.
    # One turn can batch many searches, so the iteration cap alone cannot prevent an
    # attempt spending every turn searching and never compiling. 0 disables.
    max_searches: 6
  refiner:
    max_total_tokens: 2000000
    max_attempts: 4
    max_tool_iterations: 8
  max_refinement_rounds: 8
  # Model-side concurrency is independent of Lean-side concurrency.
  # max_lean_compiles is the number of warm Lean servers, which is also the number of
  # concurrent compilations: one server serializes internally on a lock, so extra workers
  # per server only contend. Each warm Mathlib environment needs ~2GB resident, so budget
  # roughly one server per 4GB of spare RAM. 1 suits a laptop; a 128GB host can run 8-16.
  # Wide enough that measured frontiers (up to 9) are not throttled, while still capping
  # total concurrent provider requests. 0 = unbounded, as the paper describes.
  max_node_agents: 12
  # Dispatch every unsolved node at once. Parents appear in a scratch module as `axiom`
  # declarations, i.e. statements without proofs, so waiting for a parent's proof buys
  # nothing but serialization: a measured run sat at concurrency 1 for 90% of its wall
  # clock because its graph ended in a chain. Set false for the classic ready frontier.
  speculative_nodes: true
  max_lean_compiles: 1
  checkpoint_dir: ".axiomatic/blueprint"
  artifacts_dir: ".axiomatic/blueprint/artifacts"
  require_comparator: false
  comparator:
    binary: "comparator"
    module_prefix: "AxProverComparator"
    permitted_axioms:
      - "propext"
      - "Quot.sound"
      - "Classical.choice"
    timeout: 1800
